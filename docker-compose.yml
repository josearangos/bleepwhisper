name: bleeper

services:
  cli:
    build: .
    image: bleeper:local
    profiles: ["cli"]
    init: true
    user: "${BLEEPER_UID:-1000}:${BLEEPER_GID:-1000}"
    environment:
      HOME: /tmp
    working_dir: /data
    volumes:
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false

  ui:
    build: .
    image: bleeper:local
    init: true
    entrypoint: ["bleeper-ui"]
    restart: unless-stopped
    environment:
      BLEEPER_UI_MAX_UPLOAD_MB: "${BLEEPER_UI_MAX_UPLOAD_MB:-100}"
    ports:
      - "127.0.0.1:${BLEEPER_UI_HOST_PORT:-7860}:7860"
    volumes:
      - bleeper-ui-data:/var/lib/bleeper
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/' % os.environ.get('BLEEPER_UI_PORT','7860'), timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

volumes:
  bleeper-ui-data: {}
